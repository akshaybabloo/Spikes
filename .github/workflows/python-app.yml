name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: uv sync --locked
    - name: Lint with ruff
      run: uv run ruff check --output-format=github
    - name: Test with pytest
      run: uv run pytest
