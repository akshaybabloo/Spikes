name: Python Deploy

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/python-app.yml
    secrets: inherit

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
    - name: Set version from tag
      run: uv version "$GITHUB_REF_NAME" --frozen
    - name: Build
      run: uv build
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    name: Publish docs to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
    - name: Set version from tag
      run: uv version "$GITHUB_REF_NAME" --no-sync
    - name: Install dependencies
      run: uv sync --locked
    - name: Build docs
      run: uv run sphinx-build -W -b html docs docs/_build/html
    - uses: actions/upload-pages-artifact@v5
      with:
        path: docs/_build/html
    - id: deployment
      uses: actions/deploy-pages@v5

  release:
    name: Release on GitHub
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
