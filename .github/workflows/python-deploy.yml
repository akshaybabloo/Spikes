name: Python Deploy

on:
  release:
    types: [published]


jobs:
  build:

    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
    - name: Build
      run: uv build
    - name: Upload to PyPI
      run: uv publish
